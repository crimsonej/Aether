config_version: 12
context:
  adx_threshold: 25
  atr_percentiles:
  - 50
  - 75
  - 90
  atr_period: 14
data:
  poll_count: 80
  poll_interval: 60
  provider_chain:
  - Yahoo
  - Frankfurter
  - CoinGecko
  providers:
    CoinGecko:
      enabled: true
    Frankfurter:
      enabled: true
    Yahoo:
      enabled: true
  request_stagger_seconds: 2
  timeframes:
  - 5m
  - 15m
  - 1h
delivery:
  discord:
    enabled: false
    webhook_url_env: DISCORD_WEBHOOK_URL
  telegram:
    allowed_users:
    - '6938668462'
    chat_id_env: TELEGRAM_CHAT_ID
    commands_registered: false
    enabled: false
    send_startup_ping: false
    token_env: TELEGRAM_BOT_TOKEN
  web:
    enabled: false
    endpoint_url_env: WEB_ENDPOINT_URL
  whatsapp:
    auth_token_env: TWILIO_AUTH_TOKEN
    enabled: false
    phone_number_env: WHATSAPP_PHONE_NUMBER
features:
  enabled:
  - ema20
  - ema50
  - ema200
  - adx
  - rsi
  - macd
  - atr
alerts:
  price: []
  news:
    enabled: false
    pairs: []
    minimum_impact: high
    source_url: https://nfs.faireconomy.media/ff_calendar_thisweek.json?version=aeceb15b7cc6540e3b9b210d81a0d39a
    source_timezone: America/New_York
    poll_interval_seconds: 300
    lead_minutes: 60
    source_candidates:
    - https://nfs.faireconomy.media/ff_calendar_thisweek.json?version=aeceb15b7cc6540e3b9b210d81a0d39a
    - https://nfs.faireconomy.media/ff_calendar_thisweek.csv?version=aeceb15b7cc6540e3b9b210d81a0d39a
    - https://nfs.faireconomy.media/ff_calendar_thisweek.xml?version=aeceb15b7cc6540e3b9b210d81a0d39a
model_manager:
  chain:
  - Ollama
  - Local
  ollama:
    enabled: true
    base_url: http://127.0.0.1:11434
    model: nemotron-3-super:cloud
    keep_alive: 5m
ops:
  anomaly_detection: true
  auto_restart: true
  health_check_interval: 300
providers: []
schema_version: 1
signal:
  mode: signal_only
  operator_timezone: null
  profile: general
strategies:
- config_path: config/strategies/trend_following_v1.yaml
  enabled: false
  name: trend_following_v1
validation:
  cooldown:
    high_volatility: 20
    low_volatility: 10
    normal_volatility: 15
  max_spread_multiplier: 1.5
  min_confidence: 55
watchlist: []
