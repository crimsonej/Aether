config_version: 12
context:
  adx_threshold: 25
  atr_percentiles:
  - 50
  - 75
  - 90
  atr_period: 14
data:
  poll_count: 80
  poll_interval: 60
  provider_chain:
  - Yahoo
  - Frankfurter
  - CoinGecko
  providers:
    CoinGecko:
      enabled: true
    Frankfurter:
      enabled: true
    Yahoo:
      enabled: true
  request_stagger_seconds: 2
  timeframes:
  - 5m
  - 15m
  - 1h
delivery:
  discord:
    enabled: false
    webhook_url_env: DISCORD_WEBHOOK_URL
  telegram:
    allowed_users:
    - '6938668462'
    chat_id_env: TELEGRAM_CHAT_ID
    commands_registered: false
    enabled: false
    send_startup_ping: false
    token_env: TELEGRAM_BOT_TOKEN
  web:
    enabled: false
    endpoint_url_env: WEB_ENDPOINT_URL
  whatsapp:
    auth_token_env: TWILIO_AUTH_TOKEN
    enabled: false
    phone_number_env: WHATSAPP_PHONE_NUMBER
features:
  enabled:
  - ema20
  - ema50
  - ema200
  - adx
  - rsi
  - macd
  - atr
model_manager:
  chain:
  - Local
ops:
  anomaly_detection: true
  auto_restart: true
  health_check_interval: 300
providers: []
schema_version: 1
signal:
  mode: signal_only
  operator_timezone: Africa/Kampala
  profile: scalper
strategies:
- config_path: config/strategies/trend_following_v1.yaml
  enabled: true
  name: trend_following_v1
validation:
  cooldown:
    high_volatility: 20
    low_volatility: 10
    normal_volatility: 15
  max_spread_multiplier: 1.5
  min_confidence: 55
watchlist:
- EURUSD
- GBPUSD
- XAUUSD
- BTCUSD
- ETHUSD
