alerts:
  news:
    enabled: false
    lead_minutes: 60
    minimum_impact: high
    pairs: []
    poll_interval_seconds: 300
    source_candidates:
    - https://nfs.faireconomy.media/ff_calendar_thisweek.json?version=aeceb15b7cc6540e3b9b210d81a0d39a
    - https://nfs.faireconomy.media/ff_calendar_thisweek.csv?version=aeceb15b7cc6540e3b9b210d81a0d39a
    - https://nfs.faireconomy.media/ff_calendar_thisweek.xml?version=aeceb15b7cc6540e3b9b210d81a0d39a
    source_timezone: America/New_York
    source_url: https://nfs.faireconomy.media/ff_calendar_thisweek.json?version=aeceb15b7cc6540e3b9b210d81a0d39a
  price:
  - condition: above
    enabled: true
    id: 8ed6a80b2010
    price: 90000.0
    symbol: BTCUSD
  - condition: above
    enabled: true
    id: 2dee85310d6f
    price: 86000.0
    symbol: BTCUSD
broker:
  paper_broker:
    account_size: 10000.0
    commission_per_lot: 0.0
    data_dir: data/paper_broker
    enabled: true
    leverage: 30
    slippage_pips: 0.0
    spread_markup_pips: 0.0
config_version: 24
context:
  adx_threshold: 25
  atr_percentiles:
  - 50
  - 75
  - 90
  atr_period: 14
data:
  poll_count: 80
  poll_interval: 120
  provider_chain:
  - Yahoo
  - Frankfurter
  - CoinGecko
  providers:
    CoinGecko:
      enabled: true
    Frankfurter:
      enabled: true
    Yahoo:
      enabled: true
  request_stagger_seconds: 2
  timeframes:
  - 15m
  - 1h
  - 4h
delivery:
  discord:
    enabled: false
    webhook_url_env: DISCORD_WEBHOOK_URL
  telegram:
    allowed_users:
    - '6938668462'
    chat_id_env: TELEGRAM_CHAT_ID
    commands_registered: false
    enabled: true
    send_startup_ping: true
    token_env: TELEGRAM_BOT_TOKEN
  web:
    enabled: false
    endpoint_url_env: WEB_ENDPOINT_URL
  whatsapp:
    auth_token_env: TWILIO_AUTH_TOKEN
    enabled: false
    phone_number_env: WHATSAPP_PHONE_NUMBER
features:
  enabled:
  - ema20
  - ema50
  - ema200
  - adx
  - rsi
  - macd
  - atr
model_manager:
  chain:
  - Ollama
  - Local
  ollama:
    base_url: http://127.0.0.1:11434
    enabled: true
    keep_alive: 5m
    model: nemotron-3-ultra:cloud
ops:
  anomaly_detection: true
  auto_restart: true
  health_check_interval: 300
providers: []
risk:
  account_size: 10000.0
  max_daily_risk_percent: 3.0
  max_open_positions: 5
  max_portfolio_heat: 5.0
  risk_per_trade_percent: 1.0
schema_version: 1
signal:
  mode: signal_only
  operator_timezone: null
  profile: general
strategies:
- config_path: config/strategies/trend_following_v1.yaml
  enabled: true
  name: trend_following_v1
trading:
  default_volume: 0.1
  max_volume_per_trade: 1.0
validation:
  cooldown:
    high_volatility: 20
    low_volatility: 10
    normal_volatility: 15
  max_spread_multiplier: 1.5
  min_confidence: 55
watchlist:
- EURUSD
- GBPUSD
- USDJPY
- AUDUSD
- USDCAD
- EURGBP
- EURJPY
- GBPJPY
- XAUUSD
- BTCUSD
- SOLUSD
- ETHUSD
