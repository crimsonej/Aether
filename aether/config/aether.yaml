schema_version: 1

watchlist:
  - BTCUSD
  - ETHUSD
  - SOLUSD

model_manager:
  chain:
    - Ollama
    - Local
  ollama:
    enabled: true
    model: "nemotron-3-ultra:cloud"
    base_url: "http://127.0.0.1:11434"

data:
  oanda:
    api_key_env: OANDA_API_KEY
    account_id_env: OANDA_ACCOUNT_ID
    base_url: "https://api-fxtrade.oanda.com"
  fallback: null
  provider_chain:
    - CoinGecko
    - Yahoo
    - TwelveData
    - AlphaVantage

context:
  adx_threshold: 22
  atr_period: 14
  atr_percentiles: [20, 70, 90]

features:
  enabled:
    - ema20
    - ema50
    - ema200
    - adx
    - rsi
    - macd
    - atr
    - bollinger_width
    - higher_highs
    - lower_lows
    - bos
    - consolidation
    - expansion

strategies:
  - name: trend_following_v1
    enabled: true
    config_path: config/strategies/trend_following_v1.yaml

validation:
  min_confidence: 60
  max_spread_multiplier: 2.0
  cooldown:
    low_volatility: 20
    normal_volatility: 30
    high_volatility: 45

delivery:
  telegram:
    token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
  discord:
    enabled: false
  web:
    enabled: true
    port: 8080

ops:
  health_check_interval: 300
  auto_restart: true
  anomaly_detection: true

