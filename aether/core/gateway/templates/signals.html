<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signals – Aether</title>
  <meta name="description" content="Live and historical trading signals generated by the Aether strategy engine" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#080c14;--surface:#0e1421;--surface2:#151d2e;--border:#1e2d47;
      --accent:#3b82f6;--accent2:#6366f1;--green:#22c55e;--red:#ef4444;
      --yellow:#eab308;--text:#e2e8f0;--muted:#64748b;--radius:12px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
    .sidebar{width:220px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 0;position:fixed;left:0;top:0;bottom:0}
    .logo{padding:0 24px 28px;font-size:1.3rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
    .nav-item{display:flex;align-items:center;gap:10px;padding:11px 24px;color:var(--muted);text-decoration:none;font-size:.875rem;font-weight:500;transition:all .15s;border-left:3px solid transparent}
    .nav-item:hover,.nav-item.active{color:var(--text);background:var(--surface2);border-left-color:var(--accent)}
    .nav-section{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:16px 24px 6px;font-weight:600}
    .sidebar-footer{margin-top:auto;padding:16px 24px;font-size:.75rem;color:var(--muted)}
    .main{margin-left:220px;flex:1;padding:32px}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
    .page-title{font-size:1.5rem;font-weight:700}
    .ws-badge{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
    .ws-dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
    .ws-dot.on{background:var(--green);animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:24px}
    .panel-header{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
    .filter-bar{display:flex;gap:10px;padding:14px 20px;background:var(--surface2);border-bottom:1px solid var(--border)}
    .filter-bar select,.filter-bar input{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:7px;font-size:.8rem;font-family:inherit;outline:none}
    .filter-bar select:focus,.filter-bar input:focus{border-color:var(--accent)}
    table{width:100%;border-collapse:collapse}
    th{font-size:.7rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:10px 20px;text-align:left;border-bottom:1px solid var(--border)}
    td{padding:13px 20px;font-size:.85rem;border-bottom:1px solid rgba(30,45,71,.5)}
    tr:last-child td{border-bottom:none}
    tr{transition:background .1s}
    tr:hover td{background:var(--surface2)}
    .dir-buy{color:var(--green);font-weight:700}
    .dir-sell{color:var(--red);font-weight:700}
    .conf-bar{display:flex;align-items:center;gap:8px}
    .conf-track{flex:1;height:6px;background:var(--surface2);border-radius:3px;max-width:80px}
    .conf-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:600}
    .badge-buy{background:rgba(34,197,94,.12);color:var(--green)}
    .badge-sell{background:rgba(239,68,68,.12);color:var(--red)}
    .tag{display:inline-block;background:rgba(59,130,246,.1);color:var(--accent);padding:2px 7px;border-radius:4px;font-size:.7rem;margin:1px}
    .empty{text-align:center;padding:48px;color:var(--muted)}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  </style>
</head>
<body>

<nav class="sidebar">
  <div class="logo">⚡ Aether</div>
  <div class="nav-section">Platform</div>
  <a href="/" class="nav-item"><span>🏠</span> Dashboard</a>
  <a href="/signals" class="nav-item active"><span>📡</span> Signals</a>
  <a href="/strategies" class="nav-item"><span>🎯</span> Strategies</a>
  <div class="nav-section">System</div>
  <a href="/config" class="nav-item"><span>⚙️</span> Config</a>
  <a href="/health-dashboard" class="nav-item"><span>❤️</span> Health</a>
  <div class="sidebar-footer">Logged in as <strong>{{ user }}</strong></div>
</nav>

<main class="main">
  <div class="topbar">
    <h1 class="page-title">📡 Signals</h1>
    <div class="ws-badge">
      <div class="ws-dot" id="ws-dot"></div>
      <span id="ws-label">Connecting…</span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span>Live Signal Stream</span>
      <span id="signal-counter" style="font-size:.8rem;color:var(--muted)">0 signals</span>
    </div>
    <div class="filter-bar">
      <select id="filter-dir">
        <option value="">All Directions</option>
        <option value="BUY">BUY only</option>
        <option value="SELL">SELL only</option>
      </select>
      <input type="text" id="filter-sym" placeholder="Filter symbol…" style="width:140px" />
      <input type="number" id="filter-conf" placeholder="Min confidence" style="width:140px" min="0" max="100" />
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Symbol</th>
            <th>Direction</th>
            <th>Confidence</th>
            <th>Entry</th>
            <th>SL</th>
            <th>TP</th>
            <th>Tags</th>
          </tr>
        </thead>
        <tbody id="signal-tbody">
          <tr><td colspan="8" class="empty">Waiting for signals…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
  const rows = [];
  const MAX_ROWS = 100;

  function getFilters() {
    return {
      dir: document.getElementById('filter-dir').value,
      sym: document.getElementById('filter-sym').value.toUpperCase(),
      conf: parseInt(document.getElementById('filter-conf').value) || 0,
    };
  }

  function renderTable() {
    const f = getFilters();
    const filtered = rows.filter(r =>
      (!f.dir || r.direction === f.dir) &&
      (!f.sym || r.symbol.includes(f.sym)) &&
      (r.confidence >= f.conf)
    );
    document.getElementById('signal-counter').textContent = `${rows.length} signals`;
    const tbody = document.getElementById('signal-tbody');
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty">No matching signals</td></tr>';
      return;
    }
    tbody.innerHTML = filtered.map(r => {
      const tc = r.trade || {};
      const entry = tc.entry?.price ?? '—';
      const sl = tc.stop_loss?.price ?? '—';
      const tp = tc.take_profit?.price ?? '—';
      const conf = r.confidence;
      const tags = (r.reason_tags || []).map(t => `<span class="tag">${t}</span>`).join('');
      const dirCls = r.direction === 'BUY' ? 'badge-buy' : 'badge-sell';
      return `<tr>
        <td style="color:var(--muted);font-size:.78rem;white-space:nowrap">${r.time}</td>
        <td><strong>${r.symbol}</strong></td>
        <td><span class="badge ${dirCls}">${r.direction}</span></td>
        <td>
          <div class="conf-bar">
            <div class="conf-track"><div class="conf-fill" style="width:${conf}%"></div></div>
            <span>${conf}%</span>
          </div>
        </td>
        <td style="font-family:monospace">${entry}</td>
        <td style="color:var(--red);font-family:monospace">${sl}</td>
        <td style="color:var(--green);font-family:monospace">${tp}</td>
        <td>${tags}</td>
      </tr>`;
    }).join('');
  }

  document.getElementById('filter-dir').addEventListener('change', renderTable);
  document.getElementById('filter-sym').addEventListener('input', renderTable);
  document.getElementById('filter-conf').addEventListener('input', renderTable);

  function connectWS() {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    const dot = document.getElementById('ws-dot');
    const lbl = document.getElementById('ws-label');

    ws.onopen = () => { dot.classList.add('on'); lbl.textContent = 'Live'; };
    ws.onclose = () => { dot.classList.remove('on'); lbl.textContent = 'Reconnecting…'; setTimeout(connectWS, 3000); };

    ws.onmessage = (e) => {
      try {
        const payload = JSON.parse(e.data);
        // Accept both raw signal payloads and wrapped {"topic":"signal.emitted","payload":{...}}
        const topic = payload.topic || '';
        const data = payload.payload || payload;
        if (topic === 'signal.emitted' || data.signal_id) {
          const sig = {
            time: new Date().toLocaleTimeString(),
            symbol: data.symbol || '—',
            direction: data.direction || '—',
            confidence: (data.confidence?.adjusted) ?? 0,
            trade: data.trade_construction || {},
            reason_tags: data.reason_tags || [],
          };
          rows.unshift(sig);
          if (rows.length > MAX_ROWS) rows.pop();
          renderTable();
        }
      } catch(_) {}
    };
  }

  connectWS();

  // Also load any server-side signals (passed via template context)
  const serverSignals = {{ signals | tojson }};
  serverSignals.forEach(s => {
    rows.push({
      time: s.timestamp ? new Date(s.timestamp * 1000).toLocaleTimeString() : '—',
      symbol: s.symbol || '—',
      direction: s.direction || '—',
      confidence: (s.confidence?.adjusted) ?? 0,
      trade: s.trade_construction || {},
      reason_tags: s.reason_tags || [],
    });
  });
  renderTable();
</script>
</body>
</html>
