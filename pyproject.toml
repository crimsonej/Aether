[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "1.0.0"
description = "Deterministic Trading Intelligence Platform"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.48.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "jinja2==3.1.6",
    "aiofiles==25.1.0",
    "aiohttp==3.13.5",
    "requests==2.34.2",
    "numpy==2.2.6",
    "pandas==3.0.3",
    "pandas-ta==0.4.71b0",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.2",
    "prometheus-client==0.25.0",
    "jsonschema==4.26.0",
    "structlog==25.5.0",
    "rich==15.0.0",
    "prompt_toolkit==3.0.40",
    "typer==0.26.3",
    "click==8.4.1",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
aether = "aether.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["aether*"]